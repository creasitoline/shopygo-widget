<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ShopyGO | Offerte Amazon, Marketplace e Annunci Selezionati</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* INSERISCI QUI IL TUO CSS ORIGINALE */
        :root { --primary: #ffffff; --text: #131921; --amazon: #007185; --nuovo: #6c5ce7; --usato: #2ecc71; --offerta: #e67e22; --bg: #f3f3f3; --accent: #FFD814; --sconto: #CC0C39; }
        body { font-family: 'Segoe UI', system-ui; margin: 0; background: var(--bg); padding-bottom: 90px; color: var(--text); overflow-x: hidden; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
        .card { background: white; border-radius: 10px; overflow: hidden; display: flex; flex-direction: column; border: 1px solid #ddd; position: relative; }
        .image-container { width: 100%; height: 180px; background: #fff; cursor: zoom-in; }
        .card img { width: 100%; height: 100%; object-fit: cover; }
        .info { padding: 10px; flex-grow: 1; display: flex; flex-direction: column; }
        .info h4 { font-size: 0.85rem; margin: 0; min-height: 60px; line-height: 1.2; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; }
        .buy-btn { background: var(--accent); color: #000; padding: 8px; border-radius: 6px; text-decoration: none; font-size: 0.75rem; font-weight: bold; text-align: center; border: 1px solid #f0c14b; margin-top: auto; }
        /* (Assicurati di mantenere anche il resto del tuo CSS originale qui sotto) */
    </style>
</head>
<body>

    <div class="main-layout">
        <div id="product-grid" class="grid"></div>
    </div>

<script type="module">
    // ... (Tutto il tuo script originale sopra la funzione renderGrid rimane invariato) ...

    function renderGrid() {
        const grid = document.getElementById('product-grid');
        // ... (Mantieni tutta la logica dei filtri che avevi prima) ...
        
        grid.innerHTML = "";
        filtrati.forEach(p => {
            // Qui ho solo cambiato la riga del bottone
            let htmlPrezzo = getHtmlPrezzo(p);

            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `<div class="badge badge-left">${p.tipo || 'Amazon'}</div>
                ${p.stato ? `<div class="badge badge-right" style="background:${sCol}">${p.stato}</div>` : ''}
                <div class="image-container" onclick="window.apriZoom('${p.immagine}')"><img src="${p.immagine}"></div>
                <div class="info">
                    <h4>${p.titolo}</h4>
                    ${htmlPrezzo}
                    <a href="prodotto.html?id=${p.id}" class="buy-btn" style="background:${btnCol}; border-color:${btnCol}">VEDI DETTAGLI</a>
                </div>`;
            grid.appendChild(card);
        });
    }
    // ... (Il resto del tuo script originale rimane invariato) ...
</script>
</body>
</html>
