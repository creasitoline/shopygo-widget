<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ShopyGO | Offerte Amazon e Marketplace</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#007185">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* ... (MANTENUTO IL TUO CSS ORIGINALE) ... */
        :root { --primary: #ffffff; --text: #131921; --amazon: #007185; --nuovo: #6c5ce7; --usato: #2ecc71; --offerta: #e67e22; --bg: #f3f3f3; --accent: #FFD814; --sconto: #CC0C39; }
        body { font-family: 'Segoe UI', system-ui; margin: 0; background: var(--bg); padding-bottom: 90px; color: var(--text); }
        /* Aggiungi qui il resto del tuo CSS originale per brevità */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
        .card { background: white; border-radius: 10px; overflow: hidden; display: flex; flex-direction: column; border: 1px solid #ddd; }
        .buy-btn { background: var(--accent); color: #000; padding: 8px; border-radius: 6px; text-decoration: none; font-size: 0.75rem; font-weight: bold; text-align: center; display: block; margin-top: 10px; }
        .info { padding: 10px; }
    </style>
</head>
<body>

    <header>
        <img src="logo.png" alt="ShopyGO" class="logo">
        <div class="search-container">
            <input type="text" id="main-search" placeholder="Cerca nello shop..." autocomplete="off">
        </div>
    </header>

    <div class="main-layout">
        <div id="product-grid" class="grid"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, doc, increment } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyDRv3qN2qRd2rVKlTB8YDHpyhrDgRiX7vc", authDomain: "shopygo-database.firebaseapp.com", projectId: "shopygo-database", storageBucket: "shopygo-database.firebasestorage.app", messagingSenderId: "336849306481", appId: "1:336849306481:web:aef142b389ef778ba3ecd0" };
        const db = getFirestore(initializeApp(firebaseConfig));
        
        let tuttiProdotti = [];

        async function carica() {
            const snap = await getDocs(collection(db, "prodotti"));
            tuttiProdotti = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            renderGrid();
        }

        function renderGrid() {
            const grid = document.getElementById('product-grid');
            grid.innerHTML = "";
            tuttiProdotti.forEach(p => {
                const card = document.createElement('div');
                card.className = 'card';
                // MODIFICA CRITICA: Il link ora porta a prodotto.html?id=...
                card.innerHTML = `
                    <div class="image-container"><img src="${p.immagine}"></div>
                    <div class="info">
                        <h4>${p.titolo}</h4>
                        <p class="price">${p.valuta || '€'} ${p.prezzo}</p>
                        <a href="prodotto.html?id=${p.id}" class="buy-btn">VEDI DETTAGLI</a>
                    </div>`;
                grid.appendChild(card);
            });
        }
        carica();
    </script>
</body>
</html>
